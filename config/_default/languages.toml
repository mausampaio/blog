    [pt-br.params.homeInfoParams]
    Title = "Olá, eu sou o Maurício 👋"
    Content = "Desenvolvedor sênior e líder técnico em Florianópolis, trabalhando com **Java** e **Spring Boot**, **React** com TypeScript e **Kubernetes**.\n\nCheguei ao desenvolvimento depois de oito anos em infraestrutura, e essa bagagem ainda molda o jeito como penso arquitetura, observabilidade e o que de fato mantém um sistema de pé.\n\nEscrevo aqui sobre decisões técnicas, o caminho até elas e o que aprendo liderando um time."

